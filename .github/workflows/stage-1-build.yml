name: Stage 1 - Build and Infrastructure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-build:
    name: Android Debug Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36"
      - name: Build Debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

  docker-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, landing]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t telegram-${{ matrix.service }}:ci ${{ matrix.service }}

  compose-smoke-test:
    name: Docker Compose and Nginx smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-password/ci-only-password-not-for-production/' .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up --build -d
      - name: Check proxied services
        run: |
          set -eu
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1/api/health > /tmp/backend-health.json \
              && curl --fail --silent http://127.0.0.1/ > /dev/null; then
              python -c "import json; data=json.load(open('/tmp/backend-health.json')); assert data.get('database') == 'up', data"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose down -v
