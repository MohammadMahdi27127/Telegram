services:
  db:
    image: postgres:15-alpine
    container_name: hamsohbat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hamsohbat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hamsohbat_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hamsohbat_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/hamsohbat_db
    volumes:
      - ./backend/downloads:/app/downloads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); assert d.get('database') == 'up'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: hamsohbat_landing
    restart: unless-stopped
    networks:
      - app_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: hamsohbat_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/downloads:/app/downloads:ro
    depends_on:
      backend:
        condition: service_healthy
      landing:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:

networks:
  app_net:
    driver: bridge
