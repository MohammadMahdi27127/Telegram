
services:
  db:
    image: postgres:15-alpine
    container_name: hamsohbat_db
    restart: always
    environment:
      POSTGRES_DB: hamsohbat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: StrongPassword123
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hamsohbat_backend
    restart: always
    volumes:
      - ./backend/downloads:/app/downloads
    depends_on:
      - db
    networks:
      - app_net   

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: hamsohbat_landing
    restart: always
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    container_name: hamsohbat_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/downloads:/app/downloads
    depends_on:
      - backend
      - landing
    networks:
      - app_net

volumes:
  pgdata:

networks:
  app_net:
    driver: bridge